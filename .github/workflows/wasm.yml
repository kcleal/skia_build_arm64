name: Build Skia WASM

on:
  workflow_dispatch:

env:
  SKIA_BRANCH: chrome/m143
  SKIA_VERSION: m143
  # Match the SDK used to build GW, HTSlib and XZ; do not use a floating latest.
  EMSCRIPTEN_VERSION: 3.1.65

jobs:
  build:
    name: Build Skia m143 WASM
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3

      - name: Install pinned Emscripten
        run: |
          git clone https://github.com/emscripten-core/emsdk.git
          cd emsdk
          ./emsdk install "$EMSCRIPTEN_VERSION"
          ./emsdk activate "$EMSCRIPTEN_VERSION"
          source ./emsdk_env.sh
          echo "EMSDK=$GITHUB_WORKSPACE/emsdk" >> "$GITHUB_ENV"
          echo "EMSDK_NODE=$EMSDK_NODE" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/emsdk/upstream/emscripten" >> "$GITHUB_PATH"
          emcc --version

      - name: Clone depot_tools and Skia
        run: |
          git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
          # Bootstrap scripts change directory: depot_tools paths must be absolute.
          export DEPOT_TOOLS_DIR="$GITHUB_WORKSPACE/depot_tools"
          export PATH="$DEPOT_TOOLS_DIR:$PATH"
          echo "$DEPOT_TOOLS_DIR" >> "$GITHUB_PATH"
          git clone --branch "$SKIA_BRANCH" --depth 1 https://skia.googlesource.com/skia.git "$GITHUB_WORKSPACE/skia"

      - name: Build Skia with the selected SDK
        run: |
          source "$EMSDK/emsdk_env.sh"
          cd "$GITHUB_WORKSPACE/skia"
          GIT_SYNC_DEPS_SKIP_EMSDK=1 python3 tools/git-sync-deps
          # GN otherwise uses Skia's independently pinned bundled emsdk.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('modules/canvaskit/compile.sh')
          text = p.read_text()
          marker = '--args="'
          if marker not in text:
              raise SystemExit('Skia compile.sh changed: cannot inject the SDK path')
          text = text.replace(marker, marker + '${GW_SKIA_GN_ARGS} ', 1)
          p.write_text(text)
          PY
          printf -v GW_SKIA_GN_ARGS 'skia_emsdk_dir="%s"' "$EMSDK"
          export GW_SKIA_GN_ARGS
          bash modules/canvaskit/compile.sh
          for library in libskia.a libskcms.a libjpeg.a libpng.a; do
            test -s "out/canvaskit_wasm/$library"
          done
          grep -E "skia_emsdk_dir[[:space:]]*=[[:space:]]*\"$EMSDK\"" out/canvaskit_wasm/args.gn

      - name: Package libraries and matching headers
        run: |
          NAME="$GITHUB_WORKSPACE/lib/skia"
          mkdir -p "$NAME/out/Release"
          cp "$GITHUB_WORKSPACE/skia/out/canvaskit_wasm/"*.a "$NAME/out/Release/"
          cp -R "$GITHUB_WORKSPACE/skia/include" "$GITHUB_WORKSPACE/skia/modules" "$NAME/"
          rm -rf "$NAME/modules/audioplayer"
          # Trim only the package tree, preserving headers and bundled resources.
          find "$NAME" -type f \( -name '*.clang-format' -o -name '.gitignore' -o -name '*.md' -o -name '*.gn' -o -name '*.ninja' -o -name '*.cpp' -o -name '*.ninja.d' -o -name '*BUILD*' -o -name '*.txt' \) -delete
          find "$NAME" -depth -type d -name 'test*' -exec rm -rf {} +
          {
            echo "Skia: $SKIA_BRANCH"
            git -C "$GITHUB_WORKSPACE/skia" rev-parse HEAD
            echo "Emscripten: $EMSCRIPTEN_VERSION"
            emcc --version
          } > "$NAME/BUILD_INFO"
          tar -czf "$GITHUB_WORKSPACE/lib/skia-${SKIA_VERSION}-wasm.tar.gz" -C "$NAME" .

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skia-m143-wasm
          path: ${{ github.workspace }}/lib/skia-m143-wasm.tar.gz
          if-no-files-found: error
