name: Build Skia native

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macos
            arch: arm64
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
          - os: ubuntu-22.04-arm
            platform: linux
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install ninja
          else
            sudo apt-get update
            sudo apt-get install -y ninja-build clang python3 libfontconfig1-dev libfreetype-dev libegl1-mesa-dev libgles2-mesa-dev libx11-dev
          fi
      - name: Build and package m143
        run: bash build_native.sh
      - uses: actions/upload-artifact@v4
        with:
          name: skia-m143-${{ matrix.platform }}-${{ matrix.arch }}
          path: skia-m143-${{ matrix.platform }}-Release-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: skia-m143-*
          merge-multiple: true
          path: artifacts
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Skia m143 ($RELEASE_TAG)" --notes "Skia m143 for GW: macOS and Linux, x64 and arm64."
          fi
          gh release upload "$RELEASE_TAG" artifacts/*.tar.gz --clobber
